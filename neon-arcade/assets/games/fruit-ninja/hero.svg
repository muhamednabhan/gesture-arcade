<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
<defs>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
 <radialGradient id="flesh" cx=".4" cy=".4" r=".8"><stop offset="0" stop-color="#ff8c9d"/><stop offset=".55" stop-color="#ff2d55"/><stop offset="1" stop-color="#d10f3c"/></radialGradient>
 <radialGradient id="orange" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffe08a"/><stop offset=".4" stop-color="#ff9a24"/><stop offset="1" stop-color="#b83c0a"/></radialGradient>
 <radialGradient id="lemon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fffbb8"/><stop offset=".45" stop-color="#ffe53b"/><stop offset="1" stop-color="#b88a00"/></radialGradient>
 <radialGradient id="bomb" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#5a5a7c"/><stop offset=".45" stop-color="#1c1c2c"/><stop offset="1" stop-color="#050509"/></radialGradient>
 <clipPath id="above"><polygon points="-100,449 500,-109 500,-300 -100,-300"/></clipPath>
 <clipPath id="below"><polygon points="-100,449 500,-109 500,500 -100,500"/></clipPath>
 <g id="melon">
  <circle r="82" fill="#0f6b37"/><circle r="77" fill="#86df68"/><circle r="72" fill="#f0ffe8"/>
  <circle r="68" fill="url(#flesh)"/>
  <g fill="#12040b"><ellipse cx="-34" cy="-26" rx="7" ry="3.5" transform="rotate(-30 -34 -26)"/><ellipse cx="0" cy="-42" rx="7" ry="3.5" transform="rotate(90 0 -42)"/><ellipse cx="34" cy="-26" rx="7" ry="3.5" transform="rotate(30 34 -26)"/><ellipse cx="-42" cy="14" rx="7" ry="3.5"/><ellipse cx="42" cy="14" rx="7" ry="3.5"/><ellipse cx="-20" cy="40" rx="7" ry="3.5" transform="rotate(40 -20 40)"/><ellipse cx="20" cy="40" rx="7" ry="3.5" transform="rotate(-40 20 40)"/><ellipse cx="0" cy="8" rx="6" ry="3"/></g>
 </g>
</defs>

<!-- soft neon backdrop glow -->
<ellipse cx="200" cy="180" rx="170" ry="140" fill="#ff3ccf" opacity=".12" filter="url(#soft)"/>

<!-- watermelon cut in two along the blade -->
<g filter="url(#glow)">
 <g clip-path="url(#above)"><g transform="translate(184 160)"><use href="#melon"/></g></g>
 <g clip-path="url(#below)"><g transform="translate(214 184)"><use href="#melon"/></g></g>
</g>

<!-- orange, lemon, bomb -->
<g filter="url(#glow)">
 <circle cx="86" cy="86" r="36" fill="url(#orange)" stroke="#ffd48a" stroke-width="2"/>
 <path d="M86 52Q74 86 86 120M50 86H122" stroke="#d83c0a" stroke-width="2" opacity=".35" fill="none"/>
 <ellipse cx="318" cy="292" rx="36" ry="28" fill="url(#lemon)" stroke="#fff6a0" stroke-width="2" transform="rotate(-20 318 292)"/>
 <circle cx="324" cy="92" r="30" fill="url(#bomb)" stroke="#ff2a4a" stroke-width="3"/>
 <path d="M324 62c0-12 14-14 22-24" stroke="#d9c8a0" stroke-width="4" fill="none" stroke-linecap="round"/>
 <circle cx="347" cy="37" r="6" fill="#ffb02e"/>
 <path d="M312 92a12 12 0 0 1 24 0v8h-24z" fill="#ff4d6d"/><circle cx="318" cy="92" r="3.5" fill="#0a0410"/><circle cx="330" cy="92" r="3.5" fill="#0a0410"/>
</g>

<!-- the blade -->
<path d="M44 312L352 40" stroke="#ff3ccf" stroke-width="20" opacity=".22" stroke-linecap="round" filter="url(#glow)"/>
<path d="M44 312L352 40" stroke="#27f4ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
<path d="M60 312L368 42" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".95"/>

<!-- juice and sparkles -->
<g fill="#ff2d55" filter="url(#glow)"><circle cx="150" cy="122" r="5"/><circle cx="246" cy="236" r="6"/><circle cx="270" cy="120" r="4"/><circle cx="120" cy="226" r="4.5"/><circle cx="214" cy="104" r="3"/></g>
<g fill="#caff32" filter="url(#glow)"><path d="M62 190l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M350 200l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><circle cx="40" cy="60" r="3"/><circle cx="372" cy="150" r="3"/></g>
</svg>
